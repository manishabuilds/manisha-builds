<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Different Checkbox Animations</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0b0b0d;
      font-family: Arial, sans-serif;

      color: white;
    }

    .list {
      width: 380px;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .item {
      position: relative;

      display: flex;
      align-items: center;

      padding: 18px 20px;

      background: #17171a;
      border: 1px solid #29292d;

      border-radius: 14px;

      cursor: pointer;

      overflow: hidden;

      transition: 0.3s ease;
    }

    .item:hover {
      background: #1d1d21;
      transform: translateX(5px);
    }

    .item input {
      display: none;
    }

    .label {
      margin-left: 15px;

      font-size: 16px;

      color: #ddd;

      transition: 0.4s ease;
    }


    /* =====================================
       1. BOUNCE CHECKBOX
    ===================================== */

    .check-1 {
      width: 25px;
      height: 25px;

      border: 2px solid #555;
      border-radius: 7px;

      position: relative;

      transition: 0.3s;
    }

    .check-1::after {
      content: "✓";

      position: absolute;

      left: 3px;
      top: -3px;

      font-size: 20px;
      font-weight: bold;

      color: white;

      transform: scale(0) rotate(-45deg);

      transition:
        transform 0.4s cubic-bezier(.34,1.56,.64,1);
    }

    .item input:checked + .check-1 {
      background: #7c5cff;
      border-color: #7c5cff;

      transform: rotate(360deg);
    }

    .item input:checked + .check-1::after {
      transform: scale(1) rotate(0);
    }


    /* =====================================
       2. SLIDING CHECKBOX
    ===================================== */

    .check-2 {
      width: 48px;
      height: 26px;

      border-radius: 30px;

      background: #333;

      position: relative;

      transition: 0.4s;
    }

    .check-2::after {
      content: "";

      position: absolute;

      width: 20px;
      height: 20px;

      left: 3px;
      top: 3px;

      border-radius: 50%;

      background: white;

      transition:
        transform 0.5s cubic-bezier(.68,-0.55,.27,1.55);
    }

    .item input:checked + .check-2 {
      background: #00d084;
    }

    .item input:checked + .check-2::after {
      transform: translateX(22px);
    }


    /* =====================================
       3. CIRCLE DRAW CHECKBOX
    ===================================== */

    .check-3 {
      width: 27px;
      height: 27px;

      border: 3px solid #444;

      border-radius: 50%;

      position: relative;

      transition: 0.3s;
    }

    .check-3::after {
      content: "";

      position: absolute;

      width: 8px;
      height: 14px;

      left: 7px;
      top: 3px;

      border-right: 3px solid #fff;
      border-bottom: 3px solid #fff;

      transform:
        rotate(45deg)
        scale(0);

      opacity: 0;

      transition: 0.3s;
    }

    .item input:checked + .check-3 {
      border-color: #ff4d8d;

      box-shadow:
        0 0 0 7px rgba(255, 77, 141, 0.12);

      animation: pulseCircle 0.6s ease;
    }

    .item input:checked + .check-3::after {
      transform:
        rotate(45deg)
        scale(1);

      opacity: 1;
    }

    @keyframes pulseCircle {
      50% {
        transform: scale(1.25);
      }
    }


    /* =====================================
       4. X / CROSS CHECKBOX
    ===================================== */

    .check-4 {
      width: 26px;
      height: 26px;

      border: 2px solid #555;

      border-radius: 6px;

      position: relative;

      transition: 0.3s;
    }

    .check-4::before,
    .check-4::after {
      content: "";

      position: absolute;

      width: 15px;
      height: 3px;

      left: 4px;
      top: 10px;

      background: white;

      transform: scaleX(0) rotate(0);

      transition: 0.3s;
    }

    .check-4::before {
      transform-origin: left;
    }

    .check-4::after {
      transform-origin: right;
    }

    .item input:checked + .check-4 {
      background: #ff4757;
      border-color: #ff4757;

      transform: rotate(90deg);
    }

    .item input:checked + .check-4::before {
      transform: scaleX(1) rotate(45deg);
    }

    .item input:checked + .check-4::after {
      transform: scaleX(1) rotate(-45deg);
    }


    /* =====================================
       5. GLOW CHECKBOX
    ===================================== */

    .check-5 {
      width: 25px;
      height: 25px;

      border: 2px solid #555;

      border-radius: 5px;

      position: relative;

      transition: 0.4s;
    }

    .check-5::after {
      content: "★";

      position: absolute;

      left: 2px;
      top: -3px;

      font-size: 19px;

      color: white;

      opacity: 0;

      transform: scale(0) rotate(-180deg);

      transition: 0.5s;
    }

    .item input:checked + .check-5 {
      background: #ffb800;

      border-color: #ffb800;

      box-shadow:
        0 0 10px #ffb800,
        0 0 25px rgba(255, 184, 0, 0.7);
    }

    .item input:checked + .check-5::after {
      opacity: 1;

      transform: scale(1) rotate(0);
    }


    /* =====================================
       6. LOADING → CHECK
    ===================================== */

    .check-6 {
      width: 27px;
      height: 27px;

      border: 3px solid #444;

      border-top-color: #00c6ff;

      border-radius: 50%;

      position: relative;

      transition: 0.3s;
    }

    .check-6::after {
      content: "✓";

      position: absolute;

      left: 2px;
      top: -3px;

      font-size: 19px;

      color: white;

      opacity: 0;

      transform: scale(0);

      transition: 0.3s;
    }

    .item input:checked + .check-6 {
      border-color: #00e5ff;

      animation: spin 0.7s ease;
    }

    .item input:checked + .check-6::after {
      opacity: 1;
      transform: scale(1);
    }

    @keyframes spin {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================
       TEXT ANIMATION
    ===================================== */

    .item input:checked ~ .label {
      color: #666;
      transform: translateX(8px);
    }

  </style>
</head>

<body>

  <div class="list">

    <!-- 1. BOUNCE -->
    <label class="item">
      <input type="checkbox">

      <span class="check-1"></span>

      <span class="label">
        Bounce Effect
      </span>
    </label>


    <!-- 2. SLIDE -->
    <label class="item">
      <input type="checkbox">

      <span class="check-2"></span>

      <span class="label">
        Sliding Toggle
      </span>
    </label>


    <!-- 3. CIRCLE -->
    <label class="item">
      <input type="checkbox">

      <span class="check-3"></span>

      <span class="label">
        Circle Pulse
      </span>
    </label>


    <!-- 4. CROSS -->
    <label class="item">
      <input type="checkbox">

      <span class="check-4"></span>

      <span class="label">
        Cross Rotation
      </span>
    </label>


    <!-- 5. GLOW -->
    <label class="item">
      <input type="checkbox">

      <span class="check-5"></span>

      <span class="label">
        Glowing Star
      </span>
    </label>


    <!-- 6. LOADING -->
    <label class="item">
      <input type="checkbox">

      <span class="check-6"></span>

      <span class="label">
        Loading Check
      </span>
    </label>

  </div>

</body>
</html>
