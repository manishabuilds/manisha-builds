<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #93d4f1;
  font-family: Arial, Helvetica, sans-serif;
}

/* Main Card */
.product-card {
  width: 850px;
  background: #fff;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
}

/* Top section */
.top-bar {
  height: 60px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.back {
  font-size: 11px;
  color: #777;
  letter-spacing: 0.3px;
}

.heart {
  font-size: 28px;
  font-weight: 300;
  color: #555;
  cursor: pointer;
}

/* Main content */
.product-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 350px;
}

/* Image area */
.product-image {
  display: flex;
  justify-content: center;
  align-items: center;
  border-right: 1px solid #eee;
  overflow: hidden;
}

.product-image img {
  width: 75%;
  height: 280px;
  object-fit: cover;
}

/* Details */
.product-details {
  padding: 30px 35px;
}

.product-details h1 {
  font-size: 25px;
  font-weight: 400;
  color: #4d5660;
  margin-bottom: 3px;
}

.category {
  font-size: 10px;
  color: #999;
  letter-spacing: 0.5px;
}

.price {
  font-size: 22px;
  color: #444;
  margin: 18px 0;
}

.product-details p {
  max-width: 310px;
  font-size: 13px;
  line-height: 1.7;
  color: #999;
  margin-bottom: 20px;
}

/* Buttons */
.buttons {
  display: flex;
  gap: 10px;
}

.buttons button {
  background: #fff;
  border: 1px solid #ddd;
  padding: 9px 15px;
  font-size: 10px;
  color: #555;
  cursor: pointer;
  transition: 0.3s;
}

.buttons button:hover {
  background: #4d5660;
  color: white;
  border-color: #4d5660;
}

/* Responsive */
@media (max-width: 700px) {

  .product-card {
    width: 90%;
  }

  .product-content {
    grid-template-columns: 1fr;
  }

  .product-image {
    border-right: none;
    border-bottom: 1px solid #eee;
    min-height: 280px;
  }

  .product-details {
    padding: 25px;
  }

  .product-details h1 {
    font-size: 21px;
  }
}
    </style>
</head>

<body>

  <div class="product-card">

    <!-- Top Bar -->
    <div class="top-bar">
      <span class="back">‹ &nbsp; BACK TO ALL PLANTS</span>
      <span class="heart">♡</span>
    </div>

    <div class="product-content">

      <!-- Product Image -->
      <div class="product-image">
        <img
  src="https://c.pxhere.com/photos/3d/cc/red_peace_lily_flower_flowers_garden_ornamental_nature_decoration_white_flower-711389.jpg!d"
  alt="Peace Lily"
>
      </div>

      <!-- Product Details -->
      <div class="product-details">

        <h1>CLASSIC PEACE LILY</h1>

        <span class="category">POPULAR HOUSE PLANT</span>

        <div class="price">$18</div>

        <p>
          Classic Peace Lily is a spathiphyllum floor plant
          arranged in a bamboo planter with a blue & red
          ribbon and butterfly pick.
        </p>

        <div class="buttons">
          <button>ADD TO CART</button>
          <button>WISHLIST</button>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
