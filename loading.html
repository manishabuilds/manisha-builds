<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Social Menu</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#1d2233;
}

.menu{
  position:relative;
  width:250px;
  height:250px;
}

.toggle{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  font-size:24px;
  z-index:10;
}

.item{
  position:absolute;
  top:50%;
  left:50%;
  width:55px;
  height:55px;
  background:white;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  transform:translate(-50%,-50%);
  transition:0.5s;
  font-size:22px;
}

.menu.active .item:nth-child(2){
  transform:translate(-50%,-50%) translate(0,-100px);
}

.menu.active .item:nth-child(3){
  transform:translate(-50%,-50%) translate(70px,-70px);
}

.menu.active .item:nth-child(4){
  transform:translate(-50%,-50%) translate(100px,0);
}

.menu.active .item:nth-child(5){
  transform:translate(-50%,-50%) translate(70px,70px);
}

.menu.active .item:nth-child(6){
  transform:translate(-50%,-50%) translate(0,100px);
}

.menu.active .item:nth-child(7){
  transform:translate(-50%,-50%) translate(-70px,70px);
}

.menu.active .item:nth-child(8){
  transform:translate(-50%,-50%) translate(-100px,0);
}

.menu.active .item:nth-child(9){
  transform:translate(-50%,-50%) translate(-70px,-70px);
}

a{
  color:#333;
}

</style>
</head>
<body>

<div class="menu">

  <button class="toggle">
    <i class="fas fa-share-alt"></i>
  </button>

  <div class="item"><a href="#"><i class="fab fa-whatsapp"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-reddit"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-linkedin-in"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-instagram"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-github"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-youtube"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-facebook-f"></i></a></div>
  <div class="item"><a href="#"><i class="fab fa-x-twitter"></i></a></div>

</div>

<script>

const menu = document.querySelector(".menu");
const toggle = document.querySelector(".toggle");
const items = document.querySelectorAll(".item");

toggle.addEventListener("click", () => {
  menu.classList.toggle("active");

  if(menu.classList.contains("active")){

    toggle.style.transform =
      "translate(-50%,-50%) rotate(135deg)";

    items.forEach((item,index)=>{
      item.style.transitionDelay = `${index * 0.08}s`;
      item.style.opacity = "1";
      item.style.scale = "1";
    });

  }else{

    toggle.style.transform =
      "translate(-50%,-50%) rotate(0deg)";

    items.forEach((item)=>{
      item.style.transitionDelay = "0s";
      item.style.opacity = "0";
      item.style.scale = "0";
    });

  }
});
</script>

</body>
</html>
