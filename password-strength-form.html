<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>

  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
}

.container {
  width: 390px;
  padding: 32px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
}

h2 {
  margin-bottom: 8px;
  color: #312e81;
  font-size: 28px;
}

.subtitle {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 25px;
}

.input-box {
  position: relative;
}

input {
  width: 100%;
  padding: 15px 55px 15px 16px;
  border: 2px solid #ddd6fe;
  border-radius: 12px;
  outline: none;
  font-size: 16px;
  transition: 0.3s;
}

input:focus {
  border-color: #7c3aed;
  box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
}

.toggle {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #7c3aed;
  font-weight: 600;
}

.strength-bar {
  height: 9px;
  width: 100%;
  background: #e5e7eb;
  border-radius: 20px;
  margin: 18px 0 8px;
  overflow: hidden;
}

.strength {
  height: 100%;
  width: 0;
  border-radius: 20px;
  background: linear-gradient(
    90deg,
    #ef4444,
    #f97316,
    #eab308,
    #22c55e
  );
  transition: 0.4s ease;
}

.strength-text {
  font-size: 14px;
  font-weight: 700;
  color: #7c3aed;
  margin-bottom: 22px;
}

.requirements {
  list-style: none;
}

.requirements li {
  font-size: 14px;
  color: #9ca3af;
  margin: 12px 0;
  transition: 0.3s;
}

.requirements li.valid {
  color: #16a34a;
  font-weight: 600;
}

.requirements li::before {
  content: "○";
  margin-right: 10px;
  color: #a78bfa;
}

.requirements li.valid::before {
  content: "✓";
  color: #16a34a;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1, #9333ea);
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
}
  </style>
</head>

<body>

  <div class="container">

    <h2>Create Password</h2>
    <p class="subtitle">Make your password strong and secure.</p>

    <div class="input-box">
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >
      <span class="toggle" id="toggle">Show</span>
    </div>

    <div class="strength-bar">
      <div class="strength" id="strength"></div>
    </div>

    <p class="strength-text" id="strengthText">
      Enter a password
    </p>

    <ul class="requirements">
      <li id="length">At least 8 characters</li>
      <li id="uppercase">One uppercase letter</li>
      <li id="lowercase">One lowercase letter</li>
      <li id="number">One number</li>
      <li id="special">One special character</li>
    </ul>

    <button>Create Password</button>

  </div>

  <script>
    const password = document.getElementById("password");
    const strength = document.getElementById("strength");
    const strengthText = document.getElementById("strengthText");
    const toggle = document.getElementById("toggle");

    const requirements = {
      length: document.getElementById("length"),
      uppercase: document.getElementById("uppercase"),
      lowercase: document.getElementById("lowercase"),
      number: document.getElementById("number"),
      special: document.getElementById("special")
    };

    password.addEventListener("input", () => {

      const value = password.value;

      const checks = {
        length: value.length >= 8,
        uppercase: /[A-Z]/.test(value),
        lowercase: /[a-z]/.test(value),
        number: /[0-9]/.test(value),
        special: /[^A-Za-z0-9]/.test(value)
      };

      let score = 0;

      Object.keys(checks).forEach(key => {
        if (checks[key]) {
          score++;
          requirements[key].classList.add("valid");
        } else {
          requirements[key].classList.remove("valid");
        }
      });

      const percentage = score * 20;
      strength.style.width = percentage + "%";

      if (score === 0) {
        strengthText.textContent = "Enter a password";
      } else if (score <= 2) {
        strengthText.textContent = "Weak password";
      } else if (score <= 4) {
        strengthText.textContent = "Medium password";
      } else {
        strengthText.textContent = "Strong password";
      }
    });

    toggle.addEventListener("click", () => {

      if (password.type === "password") {
        password.type = "text";
        toggle.textContent = "Hide";
      } else {
        password.type = "password";
        toggle.textContent = "Show";
      }

    });
  </script>

</body>
</html>
