<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Border Fill Button</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    .btn {
      position: relative;
      padding: 16px 45px;
      border: 2px solid #222;
      background: white;
      color: #222;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      z-index: 1;
    }

    /* Left border */
    .btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 100%;
      background: #7c3aed;

      transition: width 0.45s ease;
      z-index: -1;
    }

    /* Fill entire button */
    .btn:hover::before {
      width: 100%;
    }

    .btn span {
      position: relative;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .btn:hover span {
      color: white;
    }
  </style>
</head>

<body>

  <button class="btn">
    <span>Explore More →</span>
  </button>

</body>
</html>
