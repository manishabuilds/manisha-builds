
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Like Button | manisha.builds</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #160d1b;
  color: white;
  font-family: Arial, sans-serif;
}
.card {
  text-align: center;
  padding: 35px;
  border-radius: 24px;
  background: #29152e;
}
button {
  width: 100px;
  height: 100px;
  border: 1px solid #ff6b9d55;
  border-radius: 50%;
  background: #3b1c40;
  color: #ff6b9d;
  font-size: 48px;
  cursor: pointer;
  transition: transform .2s, background .2s;
}
button.liked {
  background: #ff3f81;
  color: white;
  box-shadow: 0 0 30px #ff3f8177;
}
button.pop {
  animation: pop .35s ease;
}
@keyframes pop {
  50% { transform: scale(1.3); }
}
#count { font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h2>Give some love ❤️</h2>
  <button id="like" aria-label="Like" aria-pressed="false">
    ♡
  </button>
  <p><span id="count">0</span> likes</p>
  <p id="status" aria-live="polite">Tap the heart!</p>
</div>

<script>
const button = document.getElementById("like");
const count = document.getElementById("count");
const status = document.getElementById("status");
let likes = 0;

button.addEventListener("click", () => {
  const liked = button.classList.toggle("liked");

  likes += liked ? 1 : -1;
  count.textContent = likes;
  button.textContent = liked ? "♥" : "♡";
  button.setAttribute("aria-pressed", String(liked));
  status.textContent = liked ? "You liked it!" : "Like removed";

  button.classList.remove("pop");
  void button.offsetWidth;
  button.classList.add("pop");
});
</script>
</body>
</html>
