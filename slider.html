<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Coverflow Slider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(90deg,#3b82f6,#dbeafe);
    overflow:hidden;
}

.slider{
    position:relative;
    width:1000px;
    height:420px;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1200px;
}

.card{
    position:absolute;
    width:230px;
    height:320px;
    border-radius:20px;
    overflow:hidden;
    transition:.7s;
    cursor:pointer;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
    border:4px solid transparent;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card.active{
    transform:translateX(0) scale(1.15) rotateY(0);
    z-index:5;
    border-color:#ffd43b;
}

.card.left1{
    transform:translateX(-220px) rotateY(35deg) scale(.9);
    z-index:4;
    opacity:.95;
}

.card.left2{
    transform:translateX(-420px) rotateY(45deg) scale(.75);
    z-index:3;
    opacity:.5;
}

.card.right1{
    transform:translateX(220px) rotateY(-35deg) scale(.9);
    z-index:4;
    opacity:.95;
}

.card.right2{
    transform:translateX(420px) rotateY(-45deg) scale(.75);
    z-index:3;
    opacity:.5;
}

.card.hide{
    opacity:0;
    pointer-events:none;
}

.dots{
    position:absolute;
    top:450px;
    display:flex;
    gap:8px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#bbb;
    transition:.3s;
}

.dot.active{
    background:#111;
}

button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:white;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.prev{
    left:-70px;
}

.next{
    right:-70px;
}

button:hover{
    transform:translateY(-50%) scale(1.1);
}
</style>

</head>
<body>

<div class="slider">

<div class="dots"></div>

<button class="prev">&#10094;</button>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600">
</div>

<button class="next">&#10095;</button>

</div>

<script>

const cards = document.querySelectorAll(".card");
const dotsContainer = document.querySelector(".dots");

let current = 2;

// Create Dots
cards.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.classList.add("dot");

    dot.onclick = () => {
        current = i;
        updateSlider();
        resetAuto();
    };

    dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

function updateSlider() {

    cards.forEach(card=>{
        card.className="card";
    });

    dots.forEach(dot=>{
        dot.classList.remove("active");
    });

    dots[current].classList.add("active");

    cards[current].classList.add("active");

    let left1=(current-1+cards.length)%cards.length;
    let left2=(current-2+cards.length)%cards.length;

    let right1=(current+1)%cards.length;
    let right2=(current+2)%cards.length;

    cards[left1].classList.add("left1");
    cards[left2].classList.add("left2");

    cards[right1].classList.add("right1");
    cards[right2].classList.add("right2");

    cards.forEach((card,index)=>{

        if(
            index!==current &&
            index!==left1 &&
            index!==left2 &&
            index!==right1 &&
            index!==right2
        ){
            card.classList.add("hide");
        }

    });

}

cards.forEach((card,index)=>{

    card.addEventListener("click",()=>{

        current=index;
        updateSlider();
        resetAuto();

    });

});

document.querySelector(".next").onclick=()=>{

    current++;

    if(current>=cards.length)
        current=0;

    updateSlider();
    resetAuto();

}

document.querySelector(".prev").onclick=()=>{

    current--;

    if(current<0)
        current=cards.length-1;

    updateSlider();
    resetAuto();

}

let autoSlide;

function startAuto(){

    autoSlide=setInterval(()=>{

        current++;

        if(current>=cards.length)
            current=0;

        updateSlider();

    },3000);

}

function resetAuto(){

    clearInterval(autoSlide);

    startAuto();

}

updateSlider();

startAuto();

</script>

</body>
</html>
